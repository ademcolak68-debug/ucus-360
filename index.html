<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ennetmax - 3D Drone Uçuş Simülasyonu</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
 
/* =========================================================
   1. TEMEL SAYFA VE HARİTA
   ========================================================= */

body {
    margin: 0;
    padding: 0;
}

#map {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 100%;
}


/* =========================================================
   2. ÜST BİLDİRİM ALANI
   ========================================================= */

/* Bildirimlerin ekranda konumlandırılması */
#ust-bildirim-alani {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: max-content;
    max-width: calc(100vw - 24px);
    pointer-events: none;
}

/* Bildirim kutusu */
.ust-bildirim {
    display: flex;
    align-items: center;
    gap: 8px;
    width: fit-content;
    max-width: 100%;
    box-sizing: border-box;
    padding: 4px 8px;
    border-radius: 3px;
    background: #F2F4F7;
    color: #263445;
    border: 1px solid #D1D5DB;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.35);
    font-family: Tahoma, sans-serif;
    font-size: 12px;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity .25s ease, transform .25s ease;
}

/* Bildirimin görünür hâle gelmesi */
.ust-bildirim.goster {
    opacity: 1;
    transform: translateY(0);
}

/* Bildirim simgesi */
.bildirim-simge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 16px;
    font-size: 17px;
    font-weight: 700;
}

/* Bildirim türlerine göre simge renkleri */
.ust-bildirim.olumlu .bildirim-simge {
    color: #4ade80;
}

.ust-bildirim.bilgi .bildirim-simge {
    color: #60a5fa;
}

.ust-bildirim.uyari .bildirim-simge {
    color: #fbbf24;
}

.ust-bildirim.olumsuz .bildirim-simge {
    color: #f87171;
}


/* =========================================================
   3. SİNEMATİK SÜRE GÖSTERGESİ
   ========================================================= */

#cinematic-timer {
    position: absolute;
    right: 82px;
    bottom: 12px;
    background: #444444;
    color: #fff;
    padding: 3px 6px;
    font-family: 'Consolas', monospace;
    font-size: 10px;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    z-index: 1000;
    pointer-events: none;
    letter-spacing: .3px;
    border: 1px solid rgba(255, 255, 255, .1);
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   4. UÇUŞ MODALI VE ANA KART
   ========================================================= */

/* Uçuş penceresinin genel konumu */
.ucus-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 10px;
    background: transparent;
    pointer-events: none;
    font-family: Arial, sans-serif;
}

/* Uçuş ayar kartı */
.ucus-modal-kart {
    width: 250px;
    max-width: 94vw;
    max-height: 80vh;
    overflow-y: auto;
    padding: 9px;
    border-radius: 7px;
    background: rgba(17, 24, 39, 0.96);
    color: #fff;
    pointer-events: auto;
}

/* Uçuş kartı başlıkları */
.ucus-modal-kart h2 {
    margin: 0 0 6px;
    font-size: 15px;
}

.ucus-modal-kart h3 {
    margin: 5px 0;
    color: #38bdf8;
    font-size: 12px;
}

/* Durak ekleme ve uçuş başlatma butonlarının temel stili */
#durak-ekle-btn,
#ucus-baslat-btn {
    width: 100%;
    padding: 7px;
    margin-top: 5px;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: normal;
}

/* Durak ekleme butonu */
#durak-ekle-btn {
    background: #374151;
    color: white;
}

/* Normal uçuş butonunun temel rengi */
#ucus-baslat-btn {
    background: #0284c7;
    color: white;
}


/* =========================================================
   5. ROTA KARTLARI VE DURAK GİRİŞLERİ
   ========================================================= */

/* Her bir rota kartı */
.rota-kart {
    padding: 7px;
    margin-bottom: 6px;
    border: 1px solid #374151;
    border-radius: 5px;
}

/* Durak başlığı */
.durak-baslik {
    margin: 0 0 5px;
    color: #38bdf8;
    font-size: 12px;
}

/* Rota kartındaki alan etiketleri */
.rota-kart label {
    display: block;
    margin-top: 5px;
    margin-bottom: 2px;
    font-size: 10px;
}

/* Rota kartındaki metin girişleri */
.rota-kart input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px;
    font-size: 11px;
    border: 1px solid #4b5563;
    border-radius: 4px;
    background: #1f2937;
    color: white;
}

/* Durak silme butonu */
.durak-sil-btn {
    margin-top: 6px;
    padding: 5px 8px;
    border: 1px solid #ef4444;
    border-radius: 4px;
    background: #7f1d1d;
    color: white;
    font-size: 10px;
    cursor: pointer;
}


/* =========================================================
   6. KAMERA AYARLARI
   ========================================================= */

/* Kamera ayarlarının iki sütunlu düzeni */
.kamera-ayar {
    display: grid;
    grid-template-columns: 1fr 90px;
    gap: 5px 8px;
    align-items: center;
    padding: 7px;
    margin-bottom: 8px;
    background: #1f2937;
    border-radius: 5px;
}

/* Kamera ayarı etiketleri */
.kamera-ayar label {
    font-size: 11px;
}

/* Kamera ayarı girişleri */
.kamera-ayar input {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    padding: 5px;
    border: 1px solid #4b5563;
    border-radius: 4px;
    background: #111827;
    color: white;
    font-size: 11px;
}


/* =========================================================
   7. UÇUŞ AYARLARI VE PROJE YÖNETİMİ BUTONLARI
   ========================================================= */

/* Uçuş ayar butonlarını yan yana dizer */
.ucus-ayar-butonlari {
    display: flex;
    flex-direction: row;
    gap: 6px;
    width: 100%;
    margin-top: 8px;
}

.ucus-ayar-butonlari button {
    display: block;
    flex: 1;
    min-width: 0;
    margin: 0;
    padding: 8px 2px;
    border: none;
    border-radius: 5px;
    background: #64748b;
    color: #fff;
    font-size: 10px;
    font-weight: normal;
    line-height: 1.2;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.2s ease;
}

.ucus-ayar-butonlari button:hover,
.ucus-ayar-butonlari #ucus-ayar-yukle-btn:hover,
.ucus-ayar-butonlari #ucus-bilgileri-sil-btn:hover {
    background: #000 !important;
}

/* GeoJSON ekleme ve bilgi düzenleme butonları */
#yazi-ekle-btn,
#bilgiler-duzenle-btn {
    flex: 1;
    min-width: 0;
    padding: 7px;
    border: 0;
    border-radius: 4px;
    background: #374151;
    color: white;
    cursor: pointer;
    font-size: 10px;
    font-weight: normal;
}


/* =========================================================
   8. UÇUŞ BAŞLATMA BUTONLARI
   ========================================================= */

.ucus-baslat-butonlari {
    display: flex !important;
    flex-direction: row !important;
    gap: 6px !important;
    width: 100% !important;
    margin-top: 8px !important;
    align-items: center !important;
}

.ucus-baslat-butonlari button {
    all: unset !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 1 !important;
    height: 30px !important;
    box-sizing: border-box !important;
    background-color: #2563eb !important;
    color: #ffffff !important;
    font-family: Arial, sans-serif !important;
    font-size: 10px !important;
    font-weight: normal !important;
    border-radius: 5px !important;
    cursor: pointer !important;
    text-align: center !important;
    white-space: nowrap !important;
}

.ucus-baslat-butonlari button:hover {
    background-color: #1d4ed8 !important;
}

/* =========================================================
   9. BİLGİLER MODALI VE KARTI
   ========================================================= */

/* Bilgi penceresinin dış alanı */
#bilgiler-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(0, 0, 0, 0.65);
    align-items: center;
    justify-content: center;
    padding: 12px;
}

/* Bilgi düzenleme kartı */
.bilgiler-kart {
    box-sizing: border-box;
    width: min(440px, 94vw);
    max-height: 85vh;
    overflow-y: auto;
    padding: 14px;
    border-radius: 9px;
    background: #0f172a;
    color: white;
    border: 1px solid #38bdf8;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
}

/* Bilgi kartı başlığı */
.bilgiler-baslik {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.bilgiler-baslik h3 {
    margin: 0;
    font-size: 16px;
}

/* Bilgi modalını kapatma butonu */
#bilgi-kapat {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 5px;
    background: #334155;
    color: white;
    font-size: 19px;
    cursor: pointer;
}

#bilgi-kapat:hover {
    background: #dc2626;
}


/* =========================================================
   10. BİLGİ SATIRLARI VE GİRİŞ ALANLARI
   ========================================================= */

/* Bilgi satırlarının sütun düzeni */
.bilgi-satir {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 36px 68px 76px 40px;
    gap: 5px;
    align-items: center;
    margin-bottom: 8px;
}

/* Bilgi satırlarındaki giriş ve seçim alanları */
.bilgi-satir input,
.bilgi-satir select,
.bilgi-satir textarea {
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    height: 32px;
    padding: 4px;
    border: 1px solid #475569;
    border-radius: 4px;
    background: #1e293b;
    color: white;
    font-size: 12px;
}

/* Bilgi metninin tam satır kaplaması */
.bilgi-satir .bilgi-metni {
    grid-column: 1 / -1;
    height: 58px;
    min-height: 58px;
    resize: vertical;
    white-space: pre-wrap;
    font-family: inherit;
    padding: 6px 8px;
    font-size: 13px;
    line-height: 1.35;
}

/* Renk seçiciler */
.bilgi-satir input[type="color"] {
    height: 32px;
    padding: 2px;
}

/* Bilgi satırındaki onay kutusu ve etiketi */
.bilgi-satir label {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #cbd5e1;
}

.bilgi-satir label input {
    width: 15px;
    height: 15px;
}


/* =========================================================
   11. BİLGİ MODALI ALT BUTONLARI
   ========================================================= */

/* Alt butonların yan yana dizilmesi */
.bilgi-modal-butonlar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

/* Genel alt buton stili */
.bilgi-modal-butonlar button,
.bilgi-sil {
    padding: 8px 10px;
    border: 0;
    border-radius: 5px;
    color: white;
    background: #334155;
    font-size: 12px;
    cursor: pointer;
}

/* Tamam butonu */
#bilgi-tamam {
    margin-left: auto;
    background: #0284c7;
}

/* Buton yazılarının tek satırda kalması */
#bilgi-kapat,
#bilgi-satir-ekle,
#bilgi-tamam,
.bilgi-sil {
    white-space: nowrap;
}

/* Tamam butonu üzerine gelindiğinde */
#bilgi-tamam:hover {
    background: #0369a1;
}

/* Silme butonu üzerine gelindiğinde */
.bilgi-sil:hover {
    background: #dc2626;
}


/* =========================================================
   12. BİLGİ MODALI TELEFON EKRANI DÜZENİ
   ========================================================= */

@media (max-width: 480px) {
    .bilgiler-kart {
        width: 94vw;
        padding: 12px;
    }

    .bilgi-satir {
        grid-template-columns: minmax(0, 1fr) 36px 68px 40px;
        gap: 5px;
    }

    .bilgi-satir .bilgi-kalinligi {
        grid-column: 1 / 3;
    }

    .bilgi-satir .bilgi-sil {
        grid-column: 4;
    }
}


/* =========================================================
   13. UÇUŞ MODALI BAŞLIĞI VE KAPATMA BUTONU
   ========================================================= */

/* Uçuş kartının konumu ve imleç davranışı */
#ucus-modal .ucus-modal-kart {
    position: absolute;
    cursor: default;
}

/* Sürüklenebilir başlık */
#ucus-modal .ucus-modal-kart h2 {
    cursor: move;
    user-select: none;
}

/* Başlık ve kapatma butonunun yerleşimi */
.ucus-modal-baslik {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.ucus-modal-baslik h2 {
    margin: 0;
}

/* Uçuş modalını kapatma butonu */
#ucus-modal-kapat {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 5px;
    background: #334155;
    color: #fff;
    font-size: 19px;
    cursor: pointer;
}

#ucus-modal-kapat:hover {
    background: #dc2626;
}


/* =========================================================
   14. UÇUŞ VE BİLGİ MODALLARI KAYDIRMA ÇUBUKLARI
   ========================================================= */

/* Firefox için ince kaydırma çubuğu */
#ucus-modal .ucus-modal-kart,
#bilgiler-modal .bilgiler-kart {
    scrollbar-width: thin;
    scrollbar-color: #94a3b8 transparent;
}

/* Chrome, Edge ve Safari için kaydırma çubuğu genişliği */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar {
    width: 6px;
}

/* Kaydırma çubuğunun arka planı */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar-track,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar-track {
    background: transparent;
    margin: 10px 0;
}

/* Kaydırma tutamacı */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar-thumb,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar-thumb {
    background: #94a3b8;
    border-radius: 10px;
    border: 1px solid transparent;
    background-clip: padding-box;
}

/* Kaydırma tutamacı üzerine gelindiğinde */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar-thumb:hover,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar-thumb:hover {
    background: #64748b;
    background-clip: padding-box;
}


/* =========================================================
   15. ANLIK ZOOM GÖSTERGESİ
   ========================================================= */

#anlik-zoom {
    position: absolute;
    right: 12px;
    bottom: 12px;
    background: #444444;
    color: #fff;
    padding: 3px 6px;
    font-family: 'Roboto', sans-serif;
    font-size: 10px;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    z-index: 1000;
    pointer-events: none;
    letter-spacing: .3px;
    border: 1px solid rgba(255, 255, 255, .1);
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   16. HARİTA LOGOSU
   ========================================================= */

/* Logo ana kutusu */
#logo {
    position: fixed;
    left: 12px;
    bottom: 58px;
    z-index: 1000;
    width: 110px;
    height: auto;
    padding: 15px 5px;
    background: #444444;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-radius: 0;
}

/* Logo ana yazısı */
#logo .logo-ana {
    margin: 0;
    padding: 0;
    font-size: 16px;
	font-family: 'Inter', sans-serif;
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.2;
    white-space: nowrap;
    text-shadow: 1px 1px 1px #555555;
}

/* Logo altın renkli yazısı */
#logo .logo-altin {
    color: #D8CCAE;
}

/* Logo beyaz yazısı */
#logo .logo-beyaz {
    color: #FFFFFF !important;
    text-shadow: none !important;
    opacity: 1 !important;
}

/* Logo alt açıklaması */
#logo .logo-alt {
    margin: 0;
    padding: 0;
    color: #D8CCAE;
    font-size: 7.2px;
	font-family: 'Inter', sans-serif;
    letter-spacing: 1px;
    line-height: 1.7;
    white-space: nowrap;
}


/* =========================================================
   17. UÇUŞ PROJESİ DIŞA AKTARMA VE İÇE AKTARMA
   ========================================================= */

/* Export ve Import butonlarının ortak stili */
#ucus-export-btn,
#ucus-import-btn {
    flex: 1;
    min-width: 0;
    padding: 7px;
    border: 0;
    border-radius: 4px;
    color: #fff;
    cursor: pointer;
    font-size: 10px;
    font-weight: normal;
    line-height: 1.2;
    white-space: nowrap;
}

/* Export ve Import ortak zemin rengi */
#ucus-export-btn,
#ucus-import-btn {
    background: #0e7490;
    transition: background 0.2s ease;
}

/* İki butonun ortak hover rengi */
#ucus-export-btn:hover,
#ucus-import-btn:hover {
    background: #0891b2;
}


	

/* Uçuş ve tanıtım modallarındaki tüm butonlar için mevcut renkleri koruyan hover */
#ucus-modal button:not(:disabled),
#bilgiler-modal button:not(:disabled) {
    transition: filter 160ms ease, transform 160ms ease, box-shadow 160ms ease;
}

#ucus-modal button:not(:disabled):hover,
#bilgiler-modal button:not(:disabled):hover {
    filter: brightness(1.12);
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
}

#ucus-modal button:not(:disabled):active,
#bilgiler-modal button:not(:disabled):active {
    transform: translateY(0);
    filter: brightness(0.98);
}




/* =====================================
   YOL YAZISI MODALI
   Kompakt ve modern tasarım
===================================== */

.yol-yazisi-modal-arka {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 12px;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    pointer-events: none;
}

.yol-yazisi-modal-kutu {
    box-sizing: border-box;
    width: 100%;
    max-width: 350px;
    padding: 15px;
    background: #ffffff;
    color: #1e293b;
    border: 1px solid #dbeafe;
    border-radius: 13px;
    box-shadow: 0 12px 32px rgba(30, 64, 175, 0.20);
    font-family: Arial, sans-serif;
	pointer-events: auto;
}

/* Başlık */
.yol-yazisi-modal-baslik {
    margin: -15px -15px 14px;
    padding: 13px 15px;
    border-radius: 12px 12px 0 0;
    background: linear-gradient(120deg, #2563eb, #0891b2);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
}

/* Etiketler */
.yol-yazisi-modal-kutu label {
    display: block;
    margin: 10px 0 5px;
    color: #475569;
    font-size: 11px;
    font-weight: 700;
}

/* Giriş alanları */
.yol-yazisi-modal-kutu input {
    display: block;
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    height: 37px;
    padding: 8px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    outline: none;
    background: #f8fafc;
    color: #0f172a;
    font-family: Arial, sans-serif;
    font-size: 13px;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.yol-yazisi-modal-kutu input:focus {
    border-color: #3b82f6;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
}

/* Alt buton sırası */
.yol-yazisi-modal-butonlar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: nowrap;
    gap: 5px;
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid #e2e8f0;
}

/* Ortak buton */
.yol-yazisi-modal-butonlar button {
    display: inline-flex;
    flex: 1 1 0;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 35px;
    padding: 7px 4px;
    border: 0;
    border-radius: 7px;
    font-family: Arial, sans-serif;

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiZ2VvZ3JhcGh5cHJvZiIsImEiOiJjanYxb2t1ZG8wNGU1NGFsNXVkcnhzNmFpIn0.M3qCJK8FYa06B-Irc6FD-g';


const rotaListesi = document.getElementById('rota-listesi');

function durakEkle() {

                    style="width:24px; min-width:24px; height:24px; padding:0; font-size:16px; line-height:22px; text-align:center; display:flex; align-items:center; justify-content:center; cursor:pointer;">+</button>

}


durakEkleBtn.addEventListener('click', durakEkle);

durakEkle();



function rotalariOku() {
    const kartlar = document.querySelectorAll('#rota-listesi .rota-kart');
    const rotalar = [];

    for (let i = 0; i < kartlar.length; i++) {
        const kart = kartlar[i];

        const ad = kart.querySelector('.durak-adi').value.trim();
        const koordinatMetni = kart.querySelector('.durak-koordinat').value.trim();
        const etiket = kart.querySelector('.durak-etiket').value.trim();

        if (!ad || !koordinatMetni) {
            bildirimGoster(`${i + 1}. noktanın adı ve koordinatı girilmelidir.`, 'uyari');
            return null;
        }

        const koordinatlar = koordinatMetni.split(',').map(v => Number(v.trim()));

        if (
            koordinatlar.length !== 2 ||
            !koordinatlar.every(Number.isFinite) ||
            koordinatlar[0] < -180 ||
            koordinatlar[0] > 180 ||
            koordinatlar[1] < -90 ||
            koordinatlar[1] > 90
        ) {
            bildirimGoster(`${i + 1}. noktanın koordinatı hatalı. Örnek: 34.038831, 38.352797`, 'uyari');
            return null;
        }

        rotalar.push({
            ad: ad,
            koordinat: koordinatlar,
            etiket: etiket
        });
    }

    if (rotalar.length < 1) {
        bildirimGoster('Uçuş için en az bir nokta eklemelisin.', 'uyari');
        return null;
    }

    return rotalar;
}



let ucusRotalari = [];
let ucusBaslatildi = false;


let ucusAnimasyonFrame = null;
let ucusBaslangicZamani = null;
let aktifDurakIndex = 0;
let ucusDurdu = false;

function kameraYonunuHesapla(baslangic, hedef) {
    return turf.bearing(
        turf.point(baslangic),
        turf.point(hedef)
    );
}



function kameraAyarlariniOku() {
    const baslangicZoom = Number(document.getElementById('baslangic-zoom').value);
    const ucusZoom = Number(document.getElementById('ucus-zoom').value);
    const kameraAcisi = Number(document.getElementById('kamera-acisi').value);
    const kameraYonu = Number(document.getElementById('kamera-yonu').value);
    const donusHizi = Number(document.getElementById('donus-hizi').value);

    if (
        !Number.isFinite(baslangicZoom) ||
        !Number.isFinite(ucusZoom) ||
        !Number.isFinite(kameraAcisi) ||
        !Number.isFinite(kameraYonu) ||
        !Number.isFinite(donusHizi) ||
        baslangicZoom < 1 || baslangicZoom > 22 ||
        ucusZoom < 1 || ucusZoom > 22 ||
        kameraAcisi < 0 || kameraAcisi > 85 ||
        kameraYonu < 0 || kameraYonu > 360 ||
        donusHizi < 1 || donusHizi > 120
    ) {
        bildirimGoster('Kamera ayarlarını kontrol et.', 'uyari');
        return null;
    }

    return { baslangicZoom, ucusZoom, kameraAcisi, kameraYonu, donusHizi };
}



function ucusMuziginiBaslat() {
    const muzik = document.getElementById('ucusFonMuzigi');
    if (!muzik) return;

    muzik.pause();
    muzik.currentTime = 0;
    muzik.volume = 0;

    muzik.play().then(() => {
        const baslangic = performance.now();

        function sesiAc(zaman) {
            if (muzik.paused) return;

            const oran = Math.min((zaman - baslangic) / 2000, 1);
            muzik.volume = 0.25 * oran;

            if (oran < 1) {
                requestAnimationFrame(sesiAc);
            }
        }

        requestAnimationFrame(sesiAc);
    }).catch(hata => {
        console.warn('Uçuş müziği başlatılamadı:', hata);
    });
}

function ucusMuziginiDurdur() {
    const muzik = document.getElementById('ucusFonMuzigi');
    if (!muzik || muzik.paused) return;

    const baslangicSes = muzik.volume;
    const baslangicZamani = performance.now();

    function sesiKapat(zaman) {
        const oran = Math.min((zaman - baslangicZamani) / 4000, 1);
        muzik.volume = baslangicSes * (1 - oran);

        if (oran < 1) {
            requestAnimationFrame(sesiKapat);
        } else {
            muzik.pause();
            muzik.currentTime = 0;
        }
    }

    requestAnimationFrame(sesiKapat);
}



function ucusAnimasyonunuBaslat(noktalar, ayarlar) {
    if (!Array.isArray(noktalar) || noktalar.length < 1) {
        bildirimGoster('En az bir uçuş noktası eklemelisin.', 'uyari');
        ucusBaslatildi = false;
        return;
    }

    if (ucusAnimasyonFrame) {
        cancelAnimationFrame(ucusAnimasyonFrame);
        ucusAnimasyonFrame = null;
    }

    ucusBaslatildi = true;
    ucusDurdu = false;
    aktifDurakIndex = 0;

    const merkez = noktalar[0].koordinat;
    const dronePitch = Number(ayarlar.kameraAcisi) || 60;
    const baslangicZoom = Number(ayarlar.baslangicZoom) || 17;
    const hedefZoom = Number(ayarlar.ucusZoom) || 19;
    // Uçuş başladığında kamera yönü daima 0°; hedef yön modal ayarından alınır.
    const baslangicBearing = 0;
    const hedefBearing = Number(ayarlar.kameraYonu) || 0;
    const donusHizi = Math.max(1, Math.min(120, Number(ayarlar.donusHizi) || 20));
    const zoomAnimasyonSuresi = 3000;
    const beklemeSuresi = 3000;

    // Tüm nokta etiketleri aynı anda görünür; kamera ilk koordinatta kalır.
    ucusEtiketleriniHaritayaEkle(noktalar);

    // Uçuş Başlat'a basıldığı anda harita tam üst görünüşe geçer.
    map.jumpTo({
        center: merkez,
        zoom: baslangicZoom,
        pitch: 0,
        bearing: baslangicBearing
    });

    document.getElementById('ucus-modal').style.display = 'none';

    const kronometreBaslangici = performance.now();
    let kronometreFrame = null;

    function kronometreGuncelle() {
        if (!ucusBaslatildi) return;
        const gecen = performance.now() - kronometreBaslangici;
        const dakika = Math.floor(gecen / 60000);
        const saniye = Math.floor((gecen % 60000) / 1000);
        const salise = Math.floor((gecen % 1000) / 10);
        const ekran = document.getElementById('cinematic-timer');
        if (ekran) {
            ekran.textContent =
                `${String(dakika).padStart(2, '0')}:` +
                `${String(saniye).padStart(2, '0')}.` +
                `${String(salise).padStart(2, '0')}`;
        }
        kronometreFrame = requestAnimationFrame(kronometreGuncelle);
    }
    kronometreFrame = requestAnimationFrame(kronometreGuncelle);

    function bitir() {
        ucusBaslatildi = false;
        ucusMuziginiDurdur();
        if (kronometreFrame) cancelAnimationFrame(kronometreFrame);
        ucusAnimasyonFrame = null;
        setTimeout(() => {
            document.getElementById('ucus-modal').style.display = 'flex';
        }, 10000);
    }

    function donusuBaslat() {
        if (!ucusBaslatildi) return;
        const donusBaslangici = performance.now();
        const donusSuresi = (360 / donusHizi) * 1000;

        function donusFrame(zaman) {
            if (!ucusBaslatildi) return;
            const oran = Math.min(1, (zaman - donusBaslangici) / donusSuresi);
            map.jumpTo({
                center: merkez,
                zoom: hedefZoom,
                pitch: dronePitch,
                bearing: hedefBearing + 360 * oran
            });

            if (oran < 1) {
                ucusAnimasyonFrame = requestAnimationFrame(donusFrame);
            } else {
                map.jumpTo({
                    center: merkez,
                    zoom: hedefZoom,
                    pitch: dronePitch,
                    bearing: hedefBearing
                });
                bitir();
            }
        }
        ucusAnimasyonFrame = requestAnimationFrame(donusFrame);
    }

    function zoomFrame(zaman) {
        if (!zoomFrame.baslangic) zoomFrame.baslangic = zaman;
        if (!ucusBaslatildi) return;
        const oran = Math.min(1, (zaman - zoomFrame.baslangic) / zoomAnimasyonSuresi);
        const yumusakOran = oran < 0.5
            ? 2 * oran * oran
            : 1 - Math.pow(-2 * oran + 2, 2) / 2;

        map.jumpTo({
            center: merkez,
            zoom: baslangicZoom + (hedefZoom - baslangicZoom) * yumusakOran,
            // Üst görünüşteki 0° eğim, hedef zooma giderken modal açısına yükselir.
            pitch: dronePitch * yumusakOran,
            bearing: baslangicBearing + (hedefBearing - baslangicBearing) * yumusakOran
        });

        if (oran < 1) {
            ucusAnimasyonFrame = requestAnimationFrame(zoomFrame);
        } else {
            map.jumpTo({
                center: merkez,
                zoom: hedefZoom,
                pitch: dronePitch,
                bearing: hedefBearing
            });
            setTimeout(() => {
                if (ucusBaslatildi) donusuBaslat();
            }, beklemeSuresi);
        }
    }

    // Var olan 5 saniyelik tanıtım hazırlığı ve tanıtım kartı korunur.
    setTimeout(() => {
        if (!ucusBaslatildi) return;
        playSmoothColoredListFlow(tanitimBilgileri, () => {
            if (ucusBaslatildi) {
                zoomFrame.baslangic = null;
                ucusAnimasyonFrame = requestAnimationFrame(zoomFrame);
            }
        });
    }, 5000);
}

// Normal 360° dönüş: 
document.getElementById('ucus-baslat-btn').addEventListener('click', () => {
    if (ucusBaslatildi) return;

    const noktalar = rotalariOku();
    if (!noktalar) return;

    const ayarlar = kameraAyarlariniOku();
    if (!ayarlar) return;

    ucusRotalari = noktalar;
    setTimeout(ucusMuziginiBaslat, 2000);
    ucusAnimasyonunuBaslat(ucusRotalari, ayarlar);
});

                color: #fff;
                padding: 5px 12px;
                border-radius: 6px;
                letter-spacing: 1px;
                white-space: pre-line;
            }

            @media (max-width: 480px) {
                #smooth-info-card {
                    top: 16px;
                    left: 16px;
                    min-width: 0;
                    max-width: calc(100% - 32px);
                    padding: 16px 18px;
                }
            }
        `;
        document.head.appendChild(style);
    }

    const container = document.createElement('div');
    container.id = 'smooth-info-card';
    mapContainer.appendChild(container);

    requestAnimationFrame(() => container.classList.add('card-show'));

    let index = 0;

    function processNextLine() {
        if (!ucusBaslatildi) {
            container.remove();
            return;
        }

        if (index >= texts.length) {
            setTimeout(() => {
                container.classList.remove('card-show');
                container.classList.add('card-hide');

                setTimeout(() => {
                    container.remove();
                    if (typeof onComplete === 'function') onComplete();
                }, 800);
            }, 1500);
            return;
        }

        const item = texts[index];
        const line = document.createElement('div');
        line.className = 'smooth-line';
        line.style.color = item.color || '#ffffff';
        line.style.fontSize = `${parseFloat(item.size) || 16}px`;
        line.style.fontWeight = item.weight || '500';

        if (item.isBadge) {
            const badge = document.createElement('span');
            badge.className = 'line-badge';
            badge.style.background = item.color || '#0284c7';
            badge.textContent = String(item.text || '').replace(/\\n/g, '\n');
            line.appendChild(badge);
        } else {
            line.textContent = String(item.text || '').replace(/\\n/g, '\n');
        }

        container.appendChild(line);

        requestAnimationFrame(() => line.classList.add('line-show'));

        index++;
        setTimeout(processNextLine, 2000);
    }

    processNextLine();
}

function ucusAyarlariniYukle() {
    const kayit = localStorage.getItem(UCUS_AYAR_KAYIT_ANAHTARI);

    if (!kayit) {
        bildirimGoster('Kayıtlı uçuş ayarı bulunamadı.', 'bilgi');

    try {
        const ayarlar = JSON.parse(kayit);

        document.getElementById('baslangic-zoom').value = ayarlar.baslangicZoom ?? 17;
        document.getElementById('ucus-zoom').value = ayarlar.ucusZoom ?? 18;
        document.getElementById('kamera-acisi').value = ayarlar.kameraAcisi ?? 60;
        document.getElementById('kamera-yonu').value = ayarlar.kameraYonu ?? 0;
        document.getElementById('donus-hizi').value = ayarlar.donusHizi ?? 20;

        rotaListesi.innerHTML = '';

        if (Array.isArray(ayarlar.duraklar) && ayarlar.duraklar.length) {
            ayarlar.duraklar.forEach(durak => {
                durakEkle();

                const kartlar = rotaListesi.querySelectorAll('.rota-kart');
                const kart = kartlar[kartlar.length - 1];

                kart.querySelector('.durak-adi').value = durak.ad ?? '';
                kart.querySelector('.durak-koordinat').value = durak.koordinat ?? '';
                if (kart.querySelector('.durak-suresi')) kart.querySelector('.durak-suresi').value = durak.sure ?? '';
                kart.querySelector('.durak-etiket').value = durak.etiket ?? '';

        rotaBasliklariniGuncelle();

		yolYazilariniGeriYukle(ayarlar.yolYazilari || []);

		bildirimGoster('Kayıtlı uçuş ayarları yüklendi.', 'olumlu');
		

    } catch (hata) {
        bildirimGoster('Kayıtlı ayarlar okunamadı.', 'olumsuz');
    }

function create3DMarkerWithPulse(coordinates, titleText, ilkNokta = false) {
    // Klasik harita iğnesi + pulse halkası; daire biçimli marker kullanılmaz.
    if (!Array.isArray(coordinates) || coordinates.length < 2) {
        console.warn('Marker koordinatı geçersiz:', coordinates);
        return null;
    }

    const lng = Number(coordinates[0]);
    const lat = Number(coordinates[1]);
    if (!Number.isFinite(lng) || !Number.isFinite(lat)) {
        console.warn('Marker koordinatı sayısal değil:', coordinates);
        return null;
    }

    const el = document.createElement('div');
    el.className = 'sky-universal-label';

    const container = document.createElement('div');
    container.className = 'marker-container';

    const label = String(titleText ?? '').replace(/\\n/g, '\n').trim();
    if (label) {
        const textContainer = document.createElement('div');
        textContainer.className = 'text-container';
        const text = document.createElement('span');
        text.className = 'label-main';

        label.split(/\r?\n/).slice(0, 2).forEach((line, i) => {
            if (i > 0) text.appendChild(document.createElement('br'));
            text.appendChild(document.createTextNode(line.trim()));
        });
        textContainer.appendChild(text);
        container.appendChild(textContainer);
    }

    const pinWrap = document.createElement('div');
    pinWrap.className = 'pin-wrap';
    const pulse = document.createElement('span');
    pulse.className = 'pin-pulse';
    const pin = document.createElement('span');
	pin.style.setProperty(
		'--marker-renk',
		ilkNokta ? '#ef4444' : '#0284c7'
	);
    pin.className = 'map-pin';
    const pinCenter = document.createElement('span');
    pinCenter.className = 'map-pin-center';
    pin.appendChild(pinCenter);
    pinWrap.append(pulse, pin);
    container.appendChild(pinWrap);
    el.appendChild(container);

    if (!document.getElementById('universal-marker-style')) {
        const style = document.createElement('style');
        style.id = 'universal-marker-style';
        style.textContent = `
            .sky-universal-label { pointer-events:none; user-select:none; }
            .marker-container { display:flex; flex-direction:column; align-items:center; position:relative; }
            .text-container { display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
            .label-main {
			    font-family: Arial, sans-serif;
			    font-size: 26px;
			    font-weight: 700;
			    color: #ffffff;
			    letter-spacing: 0;
			    text-transform: uppercase;
			    display: inline-block;
			    text-align: center;
			    line-height: 1.25;
			    white-space: pre-line;
			    -webkit-text-stroke: 0;
			    text-shadow:
			        0 0 2px rgba(255, 255, 255, 0.35),
			        0 2px 4px rgba(0, 0, 0, 0.95),
			        0 5px 12px rgba(0, 0, 0, 0.7);
			    -webkit-font-smoothing: antialiased;
			    -moz-osx-font-smoothing: grayscale;
			}
            .pin-wrap { width:38px; height:42px; position:relative; display:flex; align-items:flex-start; justify-content:center; }
            .map-pin {
                position:relative; z-index:2; margin-top:2px; width:24px; height:24px;
                background: var(--marker-renk, #0284c7); border:2px solid #fff; box-sizing:border-box;
                border-radius:50% 50% 50% 0; transform:rotate(-45deg);
                box-shadow:0 2px 5px rgba(0,0,0,.55);
            }
            .map-pin-center { position:absolute; width:7px; height:7px; border-radius:50%; background:#fff; left:6.5px; top:6.5px; }
            .pin-pulse {
                position:absolute; z-index:1; left:50%; top:8px; width:25px; height:25px;
                border:2px solid #38bdf8; border-radius:50%; transform:translate(-50%,-50%) scale(.55);
                animation:mapPinPulse 1.8s ease-out infinite; pointer-events:none;
            }
            @keyframes mapPinPulse {
                0% { opacity:.85; transform:translate(-50%,-50%) scale(.55); }
                100% { opacity:0; transform:translate(-50%,-50%) scale(2.1); }
            }
        `;
        document.head.appendChild(style);
    }

    return new mapboxgl.Marker({
		element: el,
		anchor: 'bottom',
		pitchAlignment: 'viewport',
		rotationAlignment: 'viewport'
	}).setLngLat([lng, lat]).addTo(map);
}

function ucusEtiketleriniHaritayaEkle(rota) {
    // Önceki etiketleri temizle
    if (window.ucusEtiketMarkerlari) {

    }

    window.ucusEtiketMarkerlari = [];

    (Array.isArray(rota) ? rota : []).forEach(durak => {
        if (!durak || !Array.isArray(durak.koordinat)) return;
        const marker = create3DMarkerWithPulse(

			rota.indexOf(durak) === 0
		);
        if (marker) window.ucusEtiketMarkerlari.push(marker);
    });
}

const YOL_YAZISI_TOPLU_KAYNAK_ID = 'yol-yazilari-toplu-source';
const YOL_YAZISI_TOPLU_KATMAN_ID = 'yol-yazilari-toplu-text';


// ============================================
// VERİ DOĞRULAMA
// ============================================

function yolYazisiVerisiniDogrula(y) {

    if (!y || typeof y.yolAdi !== 'string' || !y.yolAdi.trim()) {
        return false;
    }

    const boyut = Number(y.boyut);

    if (!Number.isFinite(boyut) || boyut < 6 || boyut > 50) {
        return false;
    }

    for (const nokta of [y.nokta1, y.nokta2]) {

        if (
            !Array.isArray(nokta) ||
            nokta.length < 2 ||
            !Number.isFinite(Number(nokta[0])) ||
            !Number.isFinite(Number(nokta[1])) ||
            Number(nokta[0]) < -180 ||
            Number(nokta[0]) > 180 ||
            Number(nokta[1]) < -90 ||
            Number(nokta[1]) > 90
        ) {
            return false;
        }
    }

    return true;
}


// ============================================
// LOCALSTORAGE KAYIT VERİSİ
// ============================================

function yolYazisiKayitlariniHazirla() {

    return window.yolYazilari.map(y => ({
        id: y.id,
        yolAdi: y.yolAdi,
        boyut: y.boyut,
        nokta1: [...y.nokta1],
        nokta2: [...y.nokta2]
    }));
}


function yolYazisiLocalStorageKaydet() {

    localStorage.setItem(
        YOL_YAZILARI_KAYIT_ANAHTARI,
        JSON.stringify(yolYazisiKayitlariniHazirla())
    );
}


// ============================================
// GEOJSON VERİSİ OLUŞTUR
// ============================================

function yolYazisiGeoJSONHazirla(kayitlar) {

    return {
        type: 'FeatureCollection',

        features: kayitlar.map(y => ({

            type: 'Feature',

            properties: {
                kayit_id: String(y.id),
                yol_adi: y.yolAdi,
                yol_boyutu: Number(y.boyut)
            },

            geometry: {
                type: 'LineString',

                coordinates: [
                    [Number(y.nokta1[0]), Number(y.nokta1[1])],
                    [Number(y.nokta2[0]), Number(y.nokta2[1])]
                ]
            }
        }))
    };
}


// ============================================
// TEK GEOJSON KAYNAĞI VE TEK YAZI KATMANI
// ============================================

function yolYazisiTopluKatmaniniHazirla() {

    if (!map.isStyleLoaded()) return false;

    if (!map.getSource(YOL_YAZISI_TOPLU_KAYNAK_ID)) {

        map.addSource(YOL_YAZISI_TOPLU_KAYNAK_ID, {
            type: 'geojson',

            data: {
                type: 'FeatureCollection',
                features: []
            }
        });
    }

    if (!map.getLayer(YOL_YAZISI_TOPLU_KATMAN_ID)) {

        map.addLayer({

            id: YOL_YAZISI_TOPLU_KATMAN_ID,

            type: 'symbol',

            source: YOL_YAZISI_TOPLU_KAYNAK_ID,

            layout: {

                'text-field': ['get', 'yol_adi'],

                'text-font': [
                    'Open Sans Bold',
                    'Arial Unicode MS Bold'
                ],

                'text-size': ['get', 'yol_boyutu'],

                'text-letter-spacing': 0.15,

                'symbol-placement': 'line-center',

                'text-pitch-alignment': 'viewport',

                'text-rotation-alignment': 'map',

                'text-keep-upright': true,

                'text-allow-overlap': true,

                'text-ignore-placement': true,

                'text-max-angle': 90
            },

            paint: {

                'text-color': '#ffffff',

                'text-halo-color': '#0f172a',

                'text-halo-width': 2.5
            }
        });

        map.setLayerZoomRange(
            YOL_YAZISI_TOPLU_KATMAN_ID,
            0,
            24
        );
    }

    return true;
}


// ============================================
// HARİTA VERİSİNİ GÜNCELLE
// ============================================

function yolYazisiHaritaVerisiniGuncelle() {

    if (!yolYazisiTopluKatmaniniHazirla()) {
        return false;
    }

    const kaynak = map.getSource(YOL_YAZISI_TOPLU_KAYNAK_ID);

    if (!kaynak) return false;

    kaynak.setData(
        yolYazisiGeoJSONHazirla(window.yolYazilari)
    );

    return true;
}


// ============================================
// YENİ YOL YAZISINI KAYDET VE HARİTAYA EKLE
// ============================================

function yolYazisiniKatmanaDonustur(
    yolAdi,
    boyut,
    nokta1,
    nokta2,
    kayitId
) {

    if (!map.isStyleLoaded()) {
        throw new Error('Harita henüz hazır değil.');
    }

    const id = Number.isInteger(Number(kayitId)) && Number(kayitId) > 0
        ? Number(kayitId)
        : yolYazisiSayaci + 1;

    const kayit = {

        id: id,

        yolAdi: String(yolAdi).trim(),

        boyut: Number(boyut),

        nokta1: [
            Number(nokta1[0]),
            Number(nokta1[1])
        ],

        nokta2: [
            Number(nokta2[0]),
            Number(nokta2[1])
        ]
    };

    if (!yolYazisiVerisiniDogrula(kayit)) {
        throw new Error('Yol yazısı verisi geçersiz.');
    }

    if (
        kayit.nokta1[0] === kayit.nokta2[0] &&
        kayit.nokta1[1] === kayit.nokta2[1]
    ) {
        throw new Error('İki koordinat birbirinden farklı olmalıdır.');
    }

    const mevcutIndex = window.yolYazilari.findIndex(
        y => String(y.id) === String(id)
    );

    const oncekiKayit = mevcutIndex >= 0
        ? window.yolYazilari[mevcutIndex]
        : null;

    if (mevcutIndex >= 0) {
        window.yolYazilari[mevcutIndex] = kayit;
    } else {
        window.yolYazilari.push(kayit);
    }

    yolYazisiSayaci = Math.max(yolYazisiSayaci, id);

    try {

        if (!yolYazisiHaritaVerisiniGuncelle()) {
            throw new Error('Harita katmanı güncellenemedi.');
        }

        yolYazisiLocalStorageKaydet();

    } catch (hata) {

        if (mevcutIndex >= 0) {
            window.yolYazilari[mevcutIndex] = oncekiKayit;
        } else {
            window.yolYazilari = window.yolYazilari.filter(
                y => String(y.id) !== String(id)
            );
        }

        yolYazisiHaritaVerisiniGuncelle();

        throw hata;
    }

    return kayit;
}

    const boyut = Number(yolYazisiSize.value);

    if (!yolAdi) {

        bildirimGoster(
            'Lütfen yol adını yazın.',
            'uyari'
        );

        yolYazisiMetni.focus();

        return;
    }

    if (!Number.isFinite(boyut) || boyut < 6 || boyut > 50) {

        bildirimGoster(
            'Yazı boyutu 6 ile 50 arasında olmalıdır.',
            'uyari'
        );

        return;
    }

    if (yolYazisiSecimAktif || yolYazisiSilmeAktif) {
        return;
    }

    secilenYolAdi = yolAdi;

    secilenYolBoyutu = boyut;

    yolYazisiNoktalari = [];

    yolYazisiSecimAktif = true;

    yolYazisiModal.style.display = 'none';

    map.getCanvas().style.cursor = 'crosshair';

    this.textContent = '1. Noktayı Seç';

        'bilgi'
    );
});


// ============================================
// HARİTADA İKİ NOKTA SEÇİMİ
// ============================================

map.on('click', function (e) {

    if (yolYazisiSilmeAktif) {

        const bulunanlar = map.queryRenderedFeatures(e.point, {
            layers: [YOL_YAZISI_TOPLU_KATMAN_ID]
        });

        if (!bulunanlar.length) {

            bildirimGoster(
                'Silmek için bir yol yazısının üzerine tıklayın.',
                'uyari'
            );

            return;
        }

        const kayitId = bulunanlar[0].properties?.kayit_id;

        const silinecekIndex = window.yolYazilari.findIndex(
            y => String(y.id) === String(kayitId)
        );

        if (silinecekIndex === -1) {

            bildirimGoster(
                'Yol yazısı kaydı bulunamadı.',
                'uyari'
            );

            return;
        }

        window.yolYazilari.splice(silinecekIndex, 1);

        yolYazisiHaritaVerisiniGuncelle();

        yolYazisiLocalStorageKaydet();

        yolYazisiSilmeAktif = false;

        map.getCanvas().style.cursor = '';

        yolYazisiModalAc();

        bildirimGoster(
            'Seçilen yol yazısı silindi.',
            'olumlu'
        );

        return;
    }

    if (!yolYazisiSecimAktif) return;

    const nokta = [
        e.lngLat.lng,
        e.lngLat.lat
    ];

    if (yolYazisiNoktalari.length === 0) {

        yolYazisiNoktalari.push(nokta);

        yolYazisiEkleOnayBtn.textContent = '2. Noktayı Seç';

        bildirimGoster(
            'İlk nokta seçildi. Şimdi ikinci noktayı seçin.',
            'bilgi'
        );

        return;
    }

    const ilkNokta = yolYazisiNoktalari[0];

    if (
        ilkNokta[0] === nokta[0] &&
        ilkNokta[1] === nokta[1]
    ) {

        bildirimGoster(
            'İlk noktadan farklı bir nokta seçin.',
            'uyari'
        );

        return;
    }

    yolYazisiNoktalari.push(nokta);

    try {

        yolYazisiniKatmanaDonustur(
            secilenYolAdi,
            secilenYolBoyutu,
            ilkNokta,
            nokta
        );

    } catch (hata) {

        console.error('Yol yazısı ekleme hatası:', hata);

        bildirimGoster(
            'Yol yazısı eklenemedi: ' + hata.message,
            'olumsuz'
        );

        yolYazisiNoktalari = [];

        yolYazisiSecimAktif = false;

        map.getCanvas().style.cursor = '';

        yolYazisiEkleOnayBtn.textContent = 'Ekle';

        yolYazisiModalAc();

        return;
    }

    yolYazisiSecimAktif = false;

    yolYazisiNoktalari = [];

    map.getCanvas().style.cursor = '';

    yolYazisiEkleOnayBtn.textContent = 'Ekle';

    bildirimGoster(
        'Yol yazısı haritaya eklendi.',
        'olumlu'
    );

    // Yeni yazı eklemek için modalı tekrar aç.
    yolYazisiModalAc();
});

// ============================================

function yolYazilariniGeriYukle(yazilar) {

    if (!Array.isArray(yazilar)) {
        return;
    }

    if (!map.isStyleLoaded()) {

        let tamamlandi = false;

        const haritaHazir = function () {

            if (tamamlandi || !map.isStyleLoaded()) return;

            tamamlandi = true;

            map.off('load', haritaHazir);
            map.off('style.load', haritaHazir);
            map.off('idle', haritaHazir);

            yolYazilariniGeriYukle(yazilar);
        };

        map.on('load', haritaHazir);
        map.on('style.load', haritaHazir);
        map.on('idle', haritaHazir);

        return;
    }

    // Eski çoklu katman yapısını da temizle.
    const eskiKatmanlar = (map.getStyle().layers || []).filter(layer =>
        layer.id === YOL_YAZISI_TOPLU_KATMAN_ID ||
        layer.id.startsWith('yol-yazisi-text-') ||
        layer.id.startsWith('yol-yazisi-line-')
    );

    eskiKatmanlar.forEach(layer => {

        if (map.getLayer(layer.id)) {
            map.removeLayer(layer.id);
        }
    });

    const eskiKaynaklar = Object.keys(
        map.getStyle().sources || {}
    ).filter(id =>
        id === YOL_YAZISI_TOPLU_KAYNAK_ID ||
        id.startsWith('yol-yazisi-source-') ||
        id.startsWith('yol-yazisi-nokta-')
    );

    eskiKaynaklar.forEach(id => {

        if (map.getSource(id)) {
            map.removeSource(id);
        }
    });

    window.yolYazilari = [];

    yolYazisiSayaci = 0;

    const kabulEdilenler = [];

    yazilar.forEach(yazi => {

        if (!yolYazisiVerisiniDogrula(yazi)) {
            return;
        }

        const id = Number.isInteger(Number(yazi.id)) && Number(yazi.id) > 0
            ? Number(yazi.id)
            : yolYazisiSayaci + 1;

        const kayit = {

            id: id,

            yolAdi: yazi.yolAdi.trim(),

            boyut: Number(yazi.boyut),

            nokta1: yazi.nokta1.map(Number),

            nokta2: yazi.nokta2.map(Number)
        };

        if (
            kayit.nokta1[0] === kayit.nokta2[0] &&
            kayit.nokta1[1] === kayit.nokta2[1]
        ) {
            return;
        }

        const ayniId = kabulEdilenler.findIndex(
            y => String(y.id) === String(id)
        );

        if (ayniId >= 0) {
            kabulEdilenler[ayniId] = kayit;
        } else {
            kabulEdilenler.push(kayit);
        }

        yolYazisiSayaci = Math.max(yolYazisiSayaci, id);
    });

    window.yolYazilari = kabulEdilenler;

    yolYazisiHaritaVerisiniGuncelle();
}

(function () {
    const modalKart = document.querySelector(
        '#ucus-modal .ucus-modal-kart'
    );
    const baslik = modalKart?.querySelector('h2');

    if (!modalKart || !baslik) return;

    let surukleniyor = false;
    let baslangicX = 0;
    let baslangicY = 0;
    let kartX = 0;
    let kartY = 0;

    baslik.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;

        const rect = modalKart.getBoundingClientRect();

        surukleniyor = true;
        baslangicX = e.clientX;
        baslangicY = e.clientY;
        kartX = rect.left;
        kartY = rect.top;

        modalKart.style.position = 'fixed';
        modalKart.style.left = kartX + 'px';
        modalKart.style.top = kartY + 'px';
        modalKart.style.margin = '0';

        e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
        if (!surukleniyor) return;

        const yeniX = kartX + e.clientX - baslangicX;
        const yeniY = kartY + e.clientY - baslangicY;

        modalKart.style.left = Math.max(
            0, Math.min(yeniX, window.innerWidth - modalKart.offsetWidth)
        ) + 'px';

        modalKart.style.top = Math.max(
            0, Math.min(yeniY, window.innerHeight - modalKart.offsetHeight)
        ) + 'px';
    });

    document.addEventListener('mouseup', function () {
        surukleniyor = false;
    });
})();

function bilgiSatirlariniGoster() {
    bilgiSatirlari.innerHTML = '';

    tanitimBilgileri.forEach((bilgi, index) => {
        const satir = document.createElement('div');
        satir.className = 'bilgi-satir';
		satir.draggable = true;
		satir.style.cursor = 'grab';

        satir.innerHTML = `
            <textarea class="bilgi-metni"
                      rows="2"
                      placeholder="Gösterilecek metin (Enter ile alt satır)"></textarea>

            <input class="bilgi-rengi"
                   type="color"
                   title="Yazı rengi">

            <select class="bilgi-boyutu" title="Yazı boyutu">
                <option value="12">12 px</option>
                <option value="14">14 px</option>
                <option value="16">16 px</option>
                <option value="18">18 px</option>
                <option value="20">20 px</option>
                <option value="24">24 px</option>
                <option value="28">28 px</option>
                <option value="32">32 px</option>
            </select>

            <select class="bilgi-kalinligi" title="Yazı kalınlığı">
                <option value="400">Normal</option>
                <option value="500">Orta</option>
                <option value="600">Yarı kalın</option>
                <option value="700">Kalın</option>
                <option value="800">Çok kalın</option>
            </select>

            <button type="button" class="bilgi-sil">Sil</button>

            <label>
                <input type="checkbox" class="bilgi-rozet">
                Rozet olarak göster
            </label>
        `;

        satir.querySelector('.bilgi-metni').value = bilgi.text ?? '';
        satir.querySelector('.bilgi-rengi').value = bilgi.color ?? '#ffffff';
        satir.querySelector('.bilgi-boyutu').value = String(bilgi.size ?? '16');
        satir.querySelector('.bilgi-kalinligi').value = String(bilgi.weight ?? '500');
        satir.querySelector('.bilgi-rozet').checked = Boolean(bilgi.isBadge);

        satir.querySelector('.bilgi-sil').addEventListener('click', () => {
            satir.remove();
        });
		
		satir.addEventListener('dragstart', function (e) {
			satir.style.opacity = '0.5';
			e.dataTransfer.setData(
				'text/plain',
				Array.from(bilgiSatirlari.children).indexOf(satir)
			);
			e.dataTransfer.effectAllowed = 'move';
		});

		satir.addEventListener('dragend', function () {
			satir.style.opacity = '1';
		});

		satir.addEventListener('dragover', function (e) {
			e.preventDefault();
			e.dataTransfer.dropEffect = 'move';
		});

		satir.addEventListener('drop', function (e) {
			e.preventDefault();

			const kaynakIndex = Number(e.dataTransfer.getData('text/plain'));
			const satirlar = Array.from(bilgiSatirlari.children);
			const kaynakSatir = satirlar[kaynakIndex];

			if (!kaynakSatir || kaynakSatir === satir) return;

			const hedefRect = satir.getBoundingClientRect();
			const altaBirak = e.clientY > hedefRect.top + hedefRect.height / 2;

			if (altaBirak) {
				satir.after(kaynakSatir);
			} else {
				satir.before(kaynakSatir);
			}
		});

        bilgiSatirlari.appendChild(satir);
    });
}

function bildirimGoster(mesaj, tur = 'bilgi', sure = 3000) {
    let alan = document.getElementById('ust-bildirim-alani');

    if (!alan) {
        alan = document.createElement('div');
        alan.id = 'ust-bildirim-alani';
        document.body.appendChild(alan);
    }

    const simgeler = {
        olumlu: '✓',
        bilgi: '−',
        uyari: '!',
        olumsuz: '×'
    };

    const bildirim = document.createElement('div');
    bildirim.className = `ust-bildirim ${tur}`;

    const simge = document.createElement('span');
    simge.className = 'bildirim-simge';
    simge.textContent = simgeler[tur] || simgeler.bilgi;

    const yazi = document.createElement('span');
    yazi.textContent = mesaj;

    bildirim.append(simge, yazi);
    alan.appendChild(bildirim);

    requestAnimationFrame(() => bildirim.classList.add('goster'));

    setTimeout(() => {
        bildirim.classList.remove('goster');
        setTimeout(() => bildirim.remove(), 300);
    }, sure);
}



document.getElementById('ucus-export-btn').addEventListener('click', function () {
    try {
	
		const dosyaAdi = prompt(
            'Uçuş dosyasının adını yazın:',
            'Ucus_360_'
        );

        // İptal edilirse dışa aktarma işlemini durdur.
        if (dosyaAdi === null) return;

        // Boş bırakılırsa varsayılan adı kullan.
        const temizDosyaAdi = dosyaAdi.trim() || 'Ennetmax_Ucus';
	
        // Tanıtım penceresinde düzenleme varsa güncel satırları al.
        const satirlar = document.querySelectorAll(
            '#bilgi-satirlari .bilgi-satir'
        );

        if (satirlar.length > 0) {
            tanitimBilgileriniOku();
        }

        // Ekrandaki güncel uçuş ayarlarını al.
        const ucusAyarlari = {
            baslangicZoom: document.getElementById('baslangic-zoom').value,
            ucusZoom: document.getElementById('ucus-zoom').value,
            kameraAcisi: document.getElementById('kamera-acisi').value,
            kameraYonu: document.getElementById('kamera-yonu').value,
			donusHizi: document.getElementById('donus-hizi').value,
            duraklar: Array.from(
                document.querySelectorAll('#rota-listesi .rota-kart')
            ).map(function (kart) {
                return {
                    ad: kart.querySelector('.durak-adi')?.value || '',
                    koordinat: kart.querySelector('.durak-koordinat')?.value || '',
                    sure: kart.querySelector('.durak-suresi')?.value || '',
                    etiket: kart.querySelector('.durak-etiket')?.value || ''
                };
            }),

            yolYazilari: window.yolYazilari || []
        };

        const proje = {
            format: 'ennetmax-ucus-projesi',
            version: 1,
            ucusAyarlari: ucusAyarlari,
            tanitimBilgileri: tanitimBilgileri
        };

        const blob = new Blob(
            [JSON.stringify(proje, null, 2)],
            { type: 'application/json;charset=utf-8' }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

        link.href = url;
        link.download = temizDosyaAdi.replace(/[\\/:*?"<>|]/g, '_') + '.json';
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(function () {
            URL.revokeObjectURL(url);
        }, 1000);

        bildirimGoster('Uçuş JSON dosyasına aktarıldı.', 'olumlu');

    } catch (hata) {
        console.error('Export hatası:', hata);
        bildirimGoster('JSON dışa aktarma başarısız.', 'olumsuz');
    }
});




document.getElementById('ucus-import-btn').addEventListener('click', async function (event) {
    event.preventDefault();

    const repo = 'ademcolak68-debug/ucus-360';
    const apiUrl = `https://api.github.com/repos/${repo}/contents/veriler`;

    let secimModal = null;

    try {
        // GitHub klasöründeki JSON dosyalarını getir.
        const cevap = await fetch(apiUrl);

        if (!cevap.ok) {
            throw new Error('GitHub klasörü okunamadı: ' + cevap.status);
        }

        const dosyalar = await cevap.json();

        const jsonDosyalari = dosyalar.filter(dosya =>
            dosya.type === 'file' &&
            dosya.name.toLowerCase().endsWith('.json')
        );

        if (jsonDosyalari.length === 0) {
            bildirimGoster('GitHub klasöründe JSON dosyası bulunamadı.', 'olumsuz');
            return;
        }

        // Modal arka planı.
        secimModal = document.createElement('div');

        secimModal.style.cssText = `
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            box-sizing: border-box;
            background: rgba(10, 18, 32, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        `;

        // Modal kutusu.
        const kutu = document.createElement('div');

        // Modal CSS.
        if (!document.getElementById('ucus-import-modal-css')) {

                    #ucus-import-modal-butonlar {
                        display: flex !important;
                        flex-direction: row !important;
                        justify-content: flex-end !important;
                        align-items: center !important;
                        gap: 8px !important;
                        width: 100% !important;

                        padding: 10px 14px !important;
                        box-sizing: border-box !important;

                    #ucus-import-iptal,
                    #ucus-import-tamam {
                        display: block !important;
                        flex: 1 1 0 !important;
                        width: 0 !important;
                        min-width: 0 !important;
                        max-width: 100% !important;
                        min-height: 36px !important;
                        margin: 0 !important;
                        padding: 8px 4px !important;
                        box-sizing: border-box !important;
                        border: 0 !important;
                        border-radius: 5px !important;
                        font-family: 'Inter', sans-serif !important;
                        font-size: 12px !important;
                        font-weight: 600 !important;
                        line-height: 1.2 !important;
                        white-space: nowrap !important;
                        box-shadow: none !important;
                    }

                        background: #e2e8f0 !important;

            document.head.appendChild(stil);
        }

        // Üst simge.
        const simge = document.createElement('div');
        simge.textContent = '✈';

        simge.style.cssText = `
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            margin: 12px 16px 6px;
            border-radius: 8px;

            color: #2563eb;
            font-size: 19px;
        `;

        // Başlık.
        const baslik = document.createElement('h3');
        baslik.textContent = 'Uçuş Dosyası Yükle';

        baslik.style.cssText = `
            margin: 0;
            padding: 15px 16px;
            background: #666666;
            color: #ffffff;
            font-size: 15px;
            line-height: 1.4;
            font-weight: 600;
        `;

        // Kapat butonu.
        const kapatBtn = document.createElement('button');
        kapatBtn.textContent = '×';
        kapatBtn.type = 'button';
        kapatBtn.title = 'Kapat';

        kapatBtn.style.cssText = `
            position: absolute;
            top: 10px;
            right: 12px;
            width: 28px;
            height: 28px;
            padding: 0;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: #ffffff;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
        `;

        // Açıklama.
        const aciklama = document.createElement('p');
        aciklama.textContent =
            'GitHub arşivindeki uçuş dosyalarından birini seçin.';

        aciklama.style.cssText = `
            margin: 0;
            padding: 16px 16px 10px;
            font-size: 13px;
            line-height: 1.5;
            color: #64748b;
        `;

        // Dosya listesi.
        const liste = document.createElement('select');
        liste.id = 'ucus-import-modal-select';

        liste.style.cssText = `
            display: block;
            width: calc(100% - 32px);
            min-height: 46px;
            padding: 10px;
            margin: 0 16px 16px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #ffffff;
            color: #1e293b;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        `;

        const varsayilanSecenek = document.createElement('option');
        varsayilanSecenek.value = '';
        varsayilanSecenek.textContent = 'Dosya adı seçin';
        varsayilanSecenek.disabled = true;
        varsayilanSecenek.selected = true;
        liste.appendChild(varsayilanSecenek);

        jsonDosyalari
            .sort((a, b) => a.name.localeCompare(b.name, 'tr'))
            .forEach(dosya => {
                const secenek = document.createElement('option');
                secenek.value = dosya.download_url;
                secenek.textContent = dosya.name;
                liste.appendChild(secenek);
            });

        const dosyaSayisi = document.createElement('p');
        dosyaSayisi.textContent = jsonDosyalari.length + ' dosya bulundu.';

        dosyaSayisi.style.cssText = `
            margin: -12px 16px 6px;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: #64748b;
        `;

        // Buton alanı.
        const butonlar = document.createElement('div');
        butonlar.id = 'ucus-import-modal-butonlar';

        butonlar.style.cssText = `
            display: flex;
            gap: 12px;
            width: 100%;
            padding: 10px 16px;
            box-sizing: border-box;
        `;

        // Vazgeç butonu.
        const iptalBtn = document.createElement('button');
        iptalBtn.id = 'ucus-import-iptal';
        iptalBtn.type = 'button';
        iptalBtn.textContent = 'Vazgeç';

        iptalBtn.style.cssText = `
            flex: 1;
            min-width: 0;
            min-height: 42px;
            padding: 10px 14px;
            border: 0;
            border-radius: 5px;
            background: #e2e8f0;
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        `;

        // Tamam butonu.
        const ekleBtn = document.createElement('button');
        ekleBtn.id = 'ucus-import-tamam';
        ekleBtn.type = 'button';
        ekleBtn.textContent = 'Tamam';

        ekleBtn.style.cssText = `
            flex: 1.3;
            min-width: 0;
            min-height: 42px;
            padding: 10px 14px;
            border: 0;
            border-radius: 5px;
            background: #0891b2;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        `;

        // Modal kapatma.
        const modalKapat = () => {
            if (secimModal && secimModal.isConnected) {
                secimModal.remove();
            }
        };

        iptalBtn.onclick = modalKapat;
        kapatBtn.onclick = modalKapat;

        secimModal.addEventListener('click', function (e) {
            if (e.target === secimModal) {
                modalKapat();
            }
        });

        const escDinleyici = function (e) {
            if (e.key === 'Escape' && secimModal?.isConnected) {
                modalKapat();
            }
        };

        document.addEventListener('keydown', escDinleyici);

        const modalIzleyici = new MutationObserver(() => {
            if (!secimModal.isConnected) {
                document.removeEventListener('keydown', escDinleyici);
                modalIzleyici.disconnect();
            }
        });

        modalIzleyici.observe(document.body, { childList: true });

        // Modalı ekrana yerleştir.
        butonlar.append(iptalBtn, ekleBtn);
        kutu.append(simge, baslik, aciklama, liste, dosyaSayisi, butonlar, kapatBtn);
        secimModal.appendChild(kutu);
        document.body.appendChild(secimModal);

        // Seçilen GitHub JSON dosyasını yükle.
        ekleBtn.onclick = async () => {
            if (!liste.value) {
                bildirimGoster('Lütfen önce bir dosya adı seçin.', 'olumsuz');
                liste.focus();
                return;
            }

            ekleBtn.disabled = true;
            iptalBtn.disabled = true;
            liste.disabled = true;

            ekleBtn.textContent = 'Yükleniyor...';
            ekleBtn.style.opacity = '0.7';
            ekleBtn.style.cursor = 'wait';

            try {
                const dosyaCevap = await fetch(liste.value);

                if (!dosyaCevap.ok) {
                    throw new Error('GitHub JSON dosyası okunamadı.');
                }

                const veri = await dosyaCevap.json();

                // JSON dosya biçimini doğrula.
                if (
                    veri.format !== 'ennetmax-ucus-projesi' ||
                    veri.version !== 1 ||
                    !veri.ucusAyarlari ||
                    !Array.isArray(veri.ucusAyarlari.duraklar) ||
                    !Array.isArray(veri.tanitimBilgileri)
                ) {
                    throw new Error('JSON dosya biçimi geçersiz.');
                }

                const ayarlar = veri.ucusAyarlari;

                // Yol yazılarını doğrula.
                if (
                    ayarlar.yolYazilari !== undefined &&
                    !Array.isArray(ayarlar.yolYazilari)
                ) {
                    throw new Error('Yol yazıları verisi geçersiz.');
                }

                for (const yazi of ayarlar.yolYazilari || []) {
                    if (
                        !yazi ||
                        typeof yazi.yolAdi !== 'string' ||
                        !Number.isFinite(Number(yazi.boyut)) ||
                        !Array.isArray(yazi.nokta1) ||
                        !Array.isArray(yazi.nokta2) ||
                        yazi.nokta1.length !== 2 ||
                        yazi.nokta2.length !== 2 ||
                        ![...yazi.nokta1, ...yazi.nokta2].every(Number.isFinite) ||
                        [...yazi.nokta1, ...yazi.nokta2].some((deger, i) =>
                            i % 2 === 0
                                ? deger < -180 || deger > 180
                                : deger < -90 || deger > 90
                        )
                    ) {
                        throw new Error('Yol yazısı bilgisi geçersiz.');
                    }
                }

                // Kamera ayarlarını doğrula.
                for (const alan of [
                    'baslangicZoom',
                    'ucusZoom',
                    'kameraAcisi',
                    'kameraYonu',
                    'donusHizi'
                ]) {
                    if (!Number.isFinite(Number(ayarlar[alan]))) {
                        throw new Error('Kamera ayarı geçersiz: ' + alan);
                    }
                }

                if (
                    Number(ayarlar.donusHizi) < 1 ||
                    Number(ayarlar.donusHizi) > 120
                ) {
                    throw new Error('Dönüş hızı 1–120 derece/sn arasında olmalıdır.');
                }

                // Durakları doğrula.
                for (const durak of ayarlar.duraklar) {
                    if (
                        !durak ||
                        typeof durak.ad !== 'string' ||
                        typeof durak.koordinat !== 'string'
                    ) {
                        throw new Error('Durak bilgisi geçersiz.');
                    }

                    const koordinat = durak.koordinat.split(',').map(Number);

                    if (
                        koordinat.length !== 2 ||
                        !koordinat.every(Number.isFinite) ||
                        koordinat[0] < -180 || koordinat[0] > 180 ||
                        koordinat[1] < -90 || koordinat[1] > 90
                    ) {
                        throw new Error('Geçersiz koordinat: ' + durak.koordinat);
                    }
                }

                // Tanıtım bilgilerini doğrula.
                for (const bilgi of veri.tanitimBilgileri) {
                    if (
                        !bilgi ||
                        typeof bilgi.text !== 'string' ||
                        typeof bilgi.color !== 'string' ||
                        !Number.isFinite(Number(bilgi.size)) ||
                        !Number.isFinite(Number(bilgi.weight)) ||
                        typeof bilgi.isBadge !== 'boolean'
                    ) {
                        throw new Error('Tanıtım bilgisi geçersiz.');
                    }
                }

                // Geçerli verileri kayıt anahtarlarına aktar.
                localStorage.setItem(
                    UCUS_AYAR_KAYIT_ANAHTARI,
                    JSON.stringify(ayarlar)
                );

                localStorage.setItem(
                    BILGI_KAYIT_ANAHTARI,
                    JSON.stringify(veri.tanitimBilgileri)
                );

                // Mevcut yükleme fonksiyonları.
                ucusAyarlariniYukle();

                // Yol yazılarını yeni tek katmanlı sisteme yükle.
                yolYazilariniGeriYukle(ayarlar.yolYazilari || []);

                tanitimBilgileri = veri.tanitimBilgileri;

                const bilgiModal = document.getElementById('bilgiler-modal');

                if (bilgiModal && bilgiModal.style.display !== 'none') {
                    bilgiSatirlariniGoster();
                }

                modalKapat();

                bildirimGoster(
                    'Uçuş ve tanıtım bilgileri içe aktarıldı.',
                    'olumlu'
                );

            } catch (hata) {
                console.error('Import hatası:', hata);

                bildirimGoster(
                    hata.message || 'Dosya yüklenemedi.',
                    'olumsuz'
                );

                ekleBtn.disabled = false;
                iptalBtn.disabled = false;
                liste.disabled = false;

                ekleBtn.textContent = 'Tekrar Dene';
                ekleBtn.style.opacity = '1';
                ekleBtn.style.cursor = 'pointer';
            }
        };

    } catch (hata) {
        console.error('GitHub import hatası:', hata);

        bildirimGoster(
            'GitHub klasörü okunamadı. Depo herkese açık mı kontrol et.',
            'olumsuz'
        );
    }
});



	

// ============================================
// YOL YAZISI MODALINI SÜRÜKLE
// ============================================

(function () {
    const modal = document.getElementById('yol-yazisi-modal');
    const kutu = modal.querySelector('.yol-yazisi-modal-kutu');
    const baslik = modal.querySelector('.yol-yazisi-modal-baslik');

    let surukleniyor = false;
    let baslangicX = 0;
    let baslangicY = 0;
    let kutuX = 0;
    let kutuY = 0;

    baslik.addEventListener('pointerdown', function (e) {
        // X düğmesine basınca sürükleme başlamasın.
        if (e.target.closest('button')) return;

        surukleniyor = true;

        const rect = kutu.getBoundingClientRect();

        baslangicX = e.clientX;
        baslangicY = e.clientY;
        kutuX = rect.left;
        kutuY = rect.top;

        kutu.style.position = 'fixed';
        kutu.style.margin = '0';
        kutu.style.left = rect.left + 'px';
        kutu.style.top = rect.top + 'px';
        kutu.style.transform = 'none';

        baslik.setPointerCapture(e.pointerId);
        e.preventDefault();
    });

    baslik.addEventListener('pointermove', function (e) {
        if (!surukleniyor) return;

        const yeniX = kutuX + e.clientX - baslangicX;
        const yeniY = kutuY + e.clientY - baslangicY;

        const maxX = window.innerWidth - kutu.offsetWidth;
        const maxY = window.innerHeight - kutu.offsetHeight;

        kutu.style.left = Math.max(0, Math.min(yeniX, maxX)) + 'px';
        kutu.style.top = Math.max(0, Math.min(yeniY, maxY)) + 'px';
    });

    function suruklemeyiBitir() {
        surukleniyor = false;
    }

    baslik.addEventListener('pointerup', suruklemeyiBitir);
    baslik.addEventListener('pointercancel', suruklemeyiBitir);
})();
